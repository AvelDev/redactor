[project]
name = "redactor"
version = "0.1.0"
description = "Irreversible PDF redaction for Windows, macOS and Linux"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6>=6.8",
    "PyMuPDF>=1.25",
]

[project.scripts]
redactor = "redactor.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "pyinstaller>=6.11",
    "pillow>=11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redactor"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM102", "SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
pythonpath = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/redactor/ui/theme.py" = ["E501"]
